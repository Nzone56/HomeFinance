# Ship what is on master, but only once CI has passed on it.
#
# Deliberately a deploy hook rather than the Vercel CLI: the project already
# builds on Vercel, so this asks Vercel to build rather than building a second
# time here with a token that could deploy anywhere. Set the hook as the
# VERCEL_DEPLOY_HOOK_URL repository secret (Vercel → Project → Settings → Git →
# Deploy Hooks). Until it is set, the job explains itself and passes.
#
# If Vercel's own Git integration is connected to this repository it already
# deploys on push, and this workflow is redundant — keep one or the other, not
# both.
name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploys queue rather than cancel: a half-finished rollout should still finish.
concurrency:
  group: cd-master
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ask Vercel to deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL secret is set, so there is nothing to deploy yet."
            echo "Create a deploy hook in the Vercel project and add it as a repository secret."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
          echo "Vercel deploy triggered."
